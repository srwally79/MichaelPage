<section class="login-card card-surface">
  <div class="mb-4">
    <p class="text-uppercase small fw-bold text-secondary mb-2">Acceso al sistema</p>
    <h1 class="page-heading mb-2">Bienvenido</h1>
    <p class="page-subtitle mb-0">Ingresa tus credenciales para gestionar tareas.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="mb-3">
      <label class="form-label" for="username">Usuario</label>
      <input id="username" class="form-control" type="text" formControlName="username"
        autocomplete="username" placeholder="Tu usuario">
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <div class="form-text text-danger">El usuario es obligatorio.</div>
      }
    </div>

    <div class="mb-4">
      <label class="form-label" for="password">Contraseña</label>
      <input id="password" class="form-control" type="password" formControlName="password"
        autocomplete="current-password" placeholder="Tu contraseña">
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <div class="form-text text-danger">La contraseña es obligatoria.</div>
      }
    </div>

    <button class="btn btn-brand w-100" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) { <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span> }
      {{ isSubmitting() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</section>
